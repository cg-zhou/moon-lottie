<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Lottie Mario Preview</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .preview-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }
        .preview-play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.52);
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(8px);
            transform: translate(-50%, -50%) scale(0.92);
            opacity: 0;
            transition: opacity 160ms ease, transform 160ms ease;
            pointer-events: none;
            z-index: 3;
        }
        .preview-play-hint::before {
            content: '';
            width: 0;
            height: 0;
            margin-left: 3px;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 14px solid rgba(15, 23, 42, 0.62);
        }
        .preview-stage.is-paused .preview-play-hint {
            opacity: 0.82;
            transform: translate(-50%, -50%) scale(1);
        }
        #lottie-container {
            width: 100vw;
            height: 105.5vh;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 18px 36px rgba(37, 99, 235, 0.18));
            margin-bottom: -5.5vh;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <main class="preview-stage" aria-label="Moon Lottie Super Mario preview">
            <div id="lottie-container" aria-label="Animated Super Mario"></div>
            <div class="preview-play-hint" aria-hidden="true"></div>
    </main>

    <script type="module">
        import { loadAnimation } from '@moon-lottie/core'

        const assetBase = import.meta.env.BASE_URL || './'
        const player = loadAnimation({
            container: document.getElementById('lottie-container'),
            path: `${assetBase}samples/1_1_Super_Mario.json`,
            autoplay: true,
            loop: true,
            wasmPath: `${assetBase}runtime/wasm/moon-lottie-runtime.wasm`,
            jsRuntimePath: `${assetBase}runtime/js/moon-lottie-runtime.js`
        })

        const container = document.getElementById('lottie-container')
        const previewStage = document.querySelector('.preview-stage')
        let isPaused = false

        const syncPausedState = () => {
            previewStage?.classList.toggle('is-paused', isPaused)
        }

        player.play?.()
        syncPausedState()

        container?.addEventListener('click', () => {
            if (isPaused) {
                player.play?.()
                isPaused = false
            } else {
                player.pause?.()
                isPaused = true
            }

            syncPausedState()
        })

        window.addEventListener('beforeunload', () => {
            player.destroy?.()
        })
    </script>
</body>
</html>
