<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Lottie Mario Preview</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .preview-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }
        #lottie-container {
            width: 100vw;
            height: 105.5vh;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 18px 36px rgba(37, 99, 235, 0.18));
            margin-bottom: -5.5vh;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <main class="preview-stage" aria-label="Moon Lottie Super Mario preview">
            <div id="lottie-container" aria-label="Animated Super Mario"></div>
    </main>

    <script type="module">
        import { loadAnimation } from '@moon-lottie/core'

        const assetBase = import.meta.env.BASE_URL || './'
        const player = loadAnimation({
            container: document.getElementById('lottie-container'),
            path: `${assetBase}samples/1_1_Super_Mario.json`,
            autoplay: true,
            loop: true,
            wasmPath: `${assetBase}runtime/wasm/moon-lottie-runtime.wasm`,
            jsRuntimePath: `${assetBase}runtime/js/moon-lottie-runtime.js`
        })

        const container = document.getElementById('lottie-container')
        let isPaused = false

        player.play?.()

        container?.addEventListener('click', () => {
            if (isPaused) {
                player.play?.()
                isPaused = false
            } else {
                player.pause?.()
                isPaused = true
            }
        })

        window.addEventListener('beforeunload', () => {
            player.destroy?.()
        })
    </script>
</body>
</html>
